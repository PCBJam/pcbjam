name: deploy staging (GPL stack)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging-gpl
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  CDN_ORIGIN: https://pcbjam-cdn-staging.pcbjam-staging.workers.dev
  API_ORIGIN: https://pcbjam-server-staging.pcbjam-staging.workers.dev
  APP_ORIGIN: https://pcbjam-app-staging.pcbjam-staging.workers.dev
  EDITOR_ORIGIN: https://pcbjam-editor-staging.pcbjam-staging.workers.dev
  BUCKET: pcbjam-cdn-staging
  WRANGLER_CMD: npx --yes wrangler@4.99.0

jobs:
  build:
    uses: ./.github/workflows/wasm-build.yml
    # wasm-build's green-result cache: read the commit's statuses + the green
    # run's artifact, write the green mark (the default token is read-only).
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
      statuses: write
    with:
      build_3d_viewer: "ON"
      run_tests: true
      upload_output: true
    secrets:
      # Read-only R2 pair so the screenshot drift report runs on staging builds
      # too (baselines live in R2 now; without these the fetch/compare steps skip).
      CI_SCREENSHOTS_S3_ACCESS_KEY_ID: ${{ secrets.CI_SCREENSHOTS_S3_ACCESS_KEY_ID }}
      CI_SCREENSHOTS_S3_SECRET_ACCESS_KEY: ${{ secrets.CI_SCREENSHOTS_S3_SECRET_ACCESS_KEY }}
      # Write pair so staging builds also upload their renders to
      # runs/pcbjam/<run-id>/ — making them reviewable/promotable in morelli
      # (https://pcbjam-morelli-staging.pcbjam-staging.workers.dev).
      CI_SCREENSHOTS_S3_WRITE_ACCESS_KEY_ID: ${{ secrets.CI_SCREENSHOTS_S3_WRITE_ACCESS_KEY_ID }}
      CI_SCREENSHOTS_S3_WRITE_SECRET_ACCESS_KEY: ${{ secrets.CI_SCREENSHOTS_S3_WRITE_SECRET_ACCESS_KEY }}

  publish-and-deploy:
    needs: build
    runs-on: ubicloud-standard-8
    timeout-minutes: 90
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate staging deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "staging CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "staging CLOUDFLARE_ACCOUNT_ID variable is missing"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = "5be62ba000cabfaad4d11a6ef28f8395" || { echo "refusing to deploy outside the staging Cloudflare account"; exit 1; }

      - name: Init pcbjam-shared submodule
        # Not `git submodule update`: GitHub throttles that clone from the shared runner
        # egress as UNAUTHENTICATED ("GitHub is temporarily limiting some unauthenticated
        # downloads", 2026-09-01..03) even with the auto GITHUB_TOKEN rewritten into the
        # URL. The REST tarball endpoint honors the token, and nothing downstream needs
        # the submodule's .git (it is a plain pnpm workspace member). The commit is the
        # gitlink pinned in this checkout, so the tree is exactly what a submodule init
        # would produce. SUBMODULE_TOKEN is the fallback if the repo ever goes private.
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD:web/pcbjam-shared)
          mkdir -p web/pcbjam-shared
          curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/PCBJam/pcbjam-shared/tarball/${sha}" \
            | tar xz --strip-components=1 -C web/pcbjam-shared
          test -f web/pcbjam-shared/package.json

      - name: Init pcbjam-shared-ui submodule
        # @pcbjam/ui, a workspace dependency of web/standalone. Fetched like pcbjam-shared above.
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD:web/pcbjam-shared-ui)
          mkdir -p web/pcbjam-shared-ui
          curl -fsSL --retry 5 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/PCBJam/pcbjam-shared-ui/tarball/${sha}" \
            | tar xz --strip-components=1 -C web/pcbjam-shared-ui
          test -f web/pcbjam-shared-ui/package.json

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install standalone workspace
        run: pnpm --dir web install --frozen-lockfile

      - name: Download WASM output
        uses: actions/download-artifact@v4
        with:
          name: wasm-output
          path: output

      - name: Publish WASM to staging R2
        env:
          STAGING_TAG: staging-${{ github.sha }}
        run: >
          node scripts/deploy/publish-wasm.mjs --tag "$STAGING_TAG"
          --src output --driver r2 --bucket "$BUCKET" --remote
          --compress br --quality 11

      # The pcbjam-tools CLI for this commit (mcp 0005 C4), pinned to the wasm
      # just published: the PCBJam staging runner image installs it via
      # tools/kicad-tools/by-sha/<commit>.json on the staging CDN.
      - name: Publish the pcbjam-tools package to staging R2
        run: >
          node scripts/deploy/publish-kicad-tools.mjs --driver r2 --bucket "$BUCKET" --remote
          --cdn "$CDN_ORIGIN" --sha "$GITHUB_SHA"
          --version "$(node -p "require('./web/kicad-tools/package.json').version")-staging.${GITHUB_SHA::12}"

      - name: Deploy staging CDN Worker
        run: npx --yes wrangler@4.99.0 deploy --config workers/cdn/wrangler.staging.jsonc

      - name: Build staging editor
        env:
          STAGING_TAG: staging-${{ github.sha }}
        run: |
          node scripts/deploy/build-editor.mjs --tag "$STAGING_TAG" \
            --cdn "$CDN_ORIGIN" --api-base "$API_ORIGIN" \
            --app-base "$APP_ORIGIN" --brand-base "$APP_ORIGIN/brand" --errors-env staging \
            --models-source registry
          # Worker Static Assets uses not_found_handling=single-page-application,
          # which duplicates the Pages SPA line in _redirects: drop that line,
          # keep the /plugin-guide → docs redirects.
          grep -v '^/\*  *\/index\.html  *200' web/standalone/dist/_redirects > web/standalone/dist/_redirects.tmp || true
          mv web/standalone/dist/_redirects.tmp web/standalone/dist/_redirects
          # The Pages copy of the runtime handler: this Worker runs the same
          # file as its `main`, and must not upload them as public assets.
          rm web/standalone/dist/_worker.js web/standalone/dist/_routes.json

      - name: Verify immutable plugin runtime assets
        run: node scripts/deploy/verify-plugin-runtime.mjs web/standalone/src/generated/plugin-runtime.json web/standalone/dist

      - name: Deploy staging editor Worker
        run: npx --yes wrangler@4.99.0 deploy --config web/standalone/wrangler.staging.jsonc

      - name: Smoke-check staging GPL surfaces
        env:
          STAGING_TAG: staging-${{ github.sha }}
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors "$CDN_ORIGIN/wasm/manifest-$STAGING_TAG.json" >/dev/null
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors "$EDITOR_ORIGIN/" >/dev/null
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors -I "$CDN_ORIGIN/wasm/manifest-$STAGING_TAG.json" | grep -qi '^access-control-allow-origin: \*'
          headers=$(curl --fail --retry 12 --retry-delay 5 --retry-all-errors -I "$EDITOR_ORIGIN/")
          echo "$headers" | grep -qi '^cross-origin-opener-policy: same-origin'
          echo "$headers" | grep -qi '^cross-origin-embedder-policy: require-corp'
          echo "$headers" | grep -qi '^x-robots-tag:.*noindex'
          # OOM airlock (standalone-hardening 0009): /recover must NOT be isolated.
          recover=$(curl --fail --retry 12 --retry-delay 5 --retry-all-errors -I "$EDITOR_ORIGIN/recover")
          if echo "$recover" | grep -qi '^cross-origin-opener-policy:'; then echo "/recover is cross-origin isolated"; exit 1; fi

      - name: Verify deployed plugin runtime boundaries
        run: node scripts/deploy/verify-plugin-runtime.mjs web/standalone/src/generated/plugin-runtime.json "$EDITOR_ORIGIN"

      - name: Publish matching runtime receipt for the closed stack
        uses: actions/upload-artifact@v4
        with:
          name: plugin-runtime-receipt
          path: web/standalone/src/generated/plugin-runtime.json
          if-no-files-found: error

      # Event-driven hand-off: the editor for this commit is live, so re-check
      # the closed stack's staging deploy. Its newest run on staging (the one
      # that pins this editor, once the gitlink is bumped) waits cancelled
      # until the editor and the closed e2e are green; re-running it lets its
      # gate deploy, wait again or turn red. A busy run can't be re-run, so a
      # hand-off dispatch queues behind it instead. Needs CLOSED_DEPLOY_TOKEN
      # (fine-grained, Actions: write on PCBJam/pcbjam-private); without it
      # this step only warns.
      - name: Re-check the closed stack's staging deploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CLOSED_DEPLOY_TOKEN }}
          CLOSED: PCBJam/pcbjam-private
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning title=Closed deploy not started::CLOSED_DEPLOY_TOKEN is unset; run the pcbjam-private staging deploy by hand"; exit 0; }
          dispatch() { gh workflow run deploy-staging.yml -R "$CLOSED" --ref staging -f wasm_run_id="$GITHUB_RUN_ID" -f auto=true && echo "$1"; }
          tip=$(gh run list -R "$CLOSED" --workflow deploy-staging.yml --branch staging --limit 1 \
            --json databaseId,status --jq '.[0] // empty')
          if [ -z "$tip" ]; then dispatch "no closed staging deploy run yet: dispatched one"; exit 0; fi
          id=$(jq -r .databaseId <<< "$tip")
          if [ "$(jq -r .status <<< "$tip")" != completed ]; then dispatch "closed deploy run $id is busy: queued a hand-off"; exit 0; fi
          if [ -n "$(gh run view -R "$CLOSED" "$id" --json jobs --jq '.jobs[] | select(.name == "deploy" and .conclusion == "success") | .name')" ]; then
            echo "closed deploy run $id already deployed its commit; it pins an older editor, or this one: nothing to do"; exit 0
          fi
          if gh run rerun "$id" -R "$CLOSED"; then echo "re-ran closed staging deploy run $id"; else dispatch "re-run refused: dispatched a hand-off"; fi
